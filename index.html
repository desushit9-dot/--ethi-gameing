<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Games Clone</title>
    <style>
        :root { --bg: #0f1215; --card: #1a1e26; --gold: #eebf37; --text: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #161a22; }
        .logo { font-weight: bold; font-size: 1.2rem; }
        
        .tab-content { display: none; padding: 15px; }
        .active-tab { display: block; }

        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .btn-gold { background: var(--gold); color: black; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; }

        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-box { background: #252a34; padding: 20px; border-radius: 10px; text-align: center; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #1a1e26; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { text-align: center; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Dash Games</div>
        <div style="font-size: 14px;">0.01 ETB 💰</div>
    </div>

    <!-- Home Tab -->
    <div id="home" class="tab-content active-tab">
        <div class="card">
            <div style="color: var(--gold);">Got a Code?</div>
            <div style="margin-top: 5px;">Drop it in and unlock you...</div>
        </div>
        <h3>Featured Games</h3>
        <div class="game-grid">
            <div class="game-box">✈️<br>Aviator</div>
            <div class="game-box">🎱<br>Keno</div>
            <div class="game-box">🎰<br>Slots</div>
        </div>
    </div>

    <!-- Profile Tab -->
    <div id="profile" class="tab-content">
        <div class="card">
            <h3>Installation</h3>
            <p>+251968885958</p>
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">Balance<br>0.00 ETB</div>
                <div style="flex:1;">Credit<br>0.01 ETB</div>
            </div>
            <div class="btn-gold" style="margin-top:10px;">Deposit</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="showTab('home')">📊<br>Home</div>
        <div class="nav-item">👥<br>Invite</div>
        <div class="nav-item" style="color:var(--gold);">➕<br>Deposit</div>
        <div class="nav-item">🎧<br>Support</div>
        <div class="nav-item" onclick="showTab('profile')">👤<br>Profile</div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active-tab');
        }
    </script>
</body>
</html>
